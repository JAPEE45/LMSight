<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Dashboard - Mobile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }

    /* Sidebar collapsed into top navbar */
    .navbar {
      background-color: #2c3e50;
    }
    .navbar-brand {
      color: white;
      font-weight: bold;
    }
    .navbar-toggler {
      border-color: white;
    }
    .navbar-nav .nav-link {
      color: white;
    }

    /* Card style for requests */
    .request-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 15px;
      padding: 15px;
    }
    .request-header {
      font-weight: 600;
      margin-bottom: 10px;
      color: #b30059;
    }
    .request-info span {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .btn-view {
      margin-top: 8px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Mobile Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">ALIS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Log Out</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container mt-3">
    <h4 class="fw-bold">HR Dashboard</h4>
    <h5>Pending Requests</h5>

    <!-- Filters -->
    <div class="d-flex flex-column gap-2 mb-3">
      <input type="text" class="form-control" placeholder="Search...">
      <button class="btn btn-primary"><i class="fas fa-filter"></i> Filters</button>
      <select class="form-select">
        <option>Department</option>
        <option>HR</option>
        <option>Sales</option>
        <option>IT</option>
      </select>
      <select class="form-select">
        <option>-- Leave Type --</option>
        <option>Vacation Leave</option>
        <option>Sick Leave</option>
        <option>Casual Leave</option>
      </select>
    </div>

    <!-- Requests as Cards -->
    <div class="request-card">
      <div class="request-header">LeBron James</div>
      <div class="request-info">
        <span><strong>Date:</strong> 2025-05-01</span>
        <span><strong>From:</strong> June 10</span>
        <span><strong>To:</strong> June 20</span>
        <span><strong>Type:</strong> Vacation Leave</span>
        <span><strong>Credits:</strong> 1.50</span>
      </div>
      <button class="btn btn-outline-success btn-view">
        <i class="fas fa-eye"></i> View Details
      </button>
    </div>

    <div class="request-card">
      <div class="request-header">LeBron James</div>
      <div class="request-info">
        <span><strong>Date:</strong> 2025-05-01</span>
        <span><strong>From:</strong> June 10</span>
        <span><strong>To:</strong> June 20</span>
        <span><strong>Type:</strong> Vacation Leave</span>
        <span><strong>Credits:</strong> 1.50</span>
      </div>
      <button class="btn btn-outline-success btn-view">
        <i class="fas fa-eye"></i> View Details
      </button>
    </div>

  </div>

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
