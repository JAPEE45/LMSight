<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Leave Modal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .modal-xl {
            max-width: 800px;
        }
        
        .modal-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 1.25rem 1.5rem;
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
        }
        
        .btn-close {
            background: none;
            border: none;
            font-size: 1.25rem;
            color: #666;
        }
        
        .profile-section {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
        }
        
        .profile-img i {
            font-size: 2rem;
            color: #6c757d;
        }
        
        .profile-details h5 {
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }
        
        .profile-details p {
            margin-bottom: 0.25rem;
            color: #666;
            font-size: 0.9rem;
        }
        
        .leave-credits-section {
            text-align: center;
        }
        
        .leave-credits-section h6 {
            margin-bottom: 1rem;
            font-weight: 600;
            color: #333;
        }
        
        .donut-chart {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: conic-gradient(#28a745 0deg 90deg, #e9ecef 90deg 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            position: relative;
        }
        
        .donut-chart::before {
            content: '';
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            position: absolute;
        }
        
        .donut-center-value {
            position: relative;
            z-index: 2;
            font-size: 1.25rem;
            font-weight: 600;
            color: #28a745;
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }
        
        .form-control:disabled {
            background-color: #f8f9fa;
            border-color: #e9ecef;
            color: #666;
        }
        
        .download-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .download-btn:hover {
            background-color: #0056b3;
        }
        
        .action-buttons {
            border-top: 1px solid #dee2e6;
            padding-top: 1.5rem;
            margin-top: 2rem;
        }
        
        .btn-approve {
            background-color: #28a745;
            border-color: #28a745;
            color: white;
            padding: 0.75rem 2rem;
            font-weight: 600;
        }
        
        .btn-approve:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }
        
        .btn-reject {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
            padding: 0.75rem 2rem;
            font-weight: 600;
        }
        
        .btn-reject:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }
        
        textarea.form-control {
            min-height: 100px;
        }
        
        .reject-reason-btn {
            padding: 0.75rem 1rem;
            border: 1px solid #dee2e6;
            background-color: white;
            color: #333;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 0.9rem;
        }
        
        .reject-reason-btn:hover {
            background-color: #f8f9fa;
            border-color: #007bff;
        }
        
        .reject-reason-btn.active {
            background-color: #007bff !important;
            border-color: #007bff !important;
            color: white !important;
        }
        
        .modal-lg {
            max-width: 600px;
        }
        
        #rejectionReasonModal .modal-content {
            border-radius: 8px;
            border: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        
        #rejectionReasonModal h3 {
            color: #333;
            font-size: 1.5rem;
        }
        
        #rejectionReasonModal h4 {
            color: #333;
            font-size: 1.1rem;
        }
        
        @media (max-width: 768px) {
            .modal-xl {
                max-width: 95%;
            }
            
            .profile-section .row {
                text-align: center;
            }
            
            .profile-img {
                margin: 0 auto 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Button to trigger modal -->
    <div class="container mt-5">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#requestLeaveModal">
            Open Request Leave Modal
        </button>
        <button type="button" class="btn btn-warning ms-2" data-bs-toggle="modal" data-bs-target="#rejectionReasonModal">
            Test Rejection Modal
        </button>
    </div>

    <!-- Request Leave Modal -->
    <div class="modal fade" id="requestLeaveModal" tabindex="-1" aria-labelledby="requestLeaveModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header">
                    <h1 class="modal-title" id="requestLeaveModalLabel">Request Leave</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body">
                    <!-- Profile Section -->
                    <div class="profile-section">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <div class="d-flex align-items-center">
                                    <div class="profile-img">
                                        <i class="fa-solid fa-user"></i>
                                    </div>
                                    <div class="profile-details">
                                        <h5>Juan Dela Cruz</h5>
                                        <p>Department: <strong>Sales and Marketing</strong></p>
                                        <p>Job title: <strong>Sales Manager</strong></p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="leave-credits-section">
                                    <h6>Leave Credits</h6>
                                    <div class="donut-chart">
                                        <div class="donut-center-value">1.25</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Form Fields -->
                    <form>
                        <!-- Row 1: Leave Type, Start Date, End Date -->
                        <div class="row mb-3">
                            <div class="col-md-4 mb-3">
                                <label for="leaveType" class="form-label">Leave Type</label>
                                <input type="text" class="form-control" id="leaveType" disabled>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="startDate" class="form-label">Start Date</label>
                                <input type="text" class="form-control" id="startDate" disabled>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="endDate" class="form-label">End Date</label>
                                <input type="text" class="form-control" id="endDate" disabled>
                            </div>
                        </div>

                        <!-- Row 2: Commutation, Details of Leave -->
                        <div class="row mb-3">
                            <div class="col-md-6 mb-3">
                                <label for="commutation" class="form-label">Commutation</label>
                                <input type="text" class="form-control" id="commutation" disabled>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="leaveDetails" class="form-label">Details of Leave</label>
                                <input type="text" class="form-control" id="leaveDetails" disabled>
                            </div>
                        </div>

                        <!-- Attached Document -->
                        <div class="row mb-3">
                            <div class="col-12 mb-3">
                                <label for="attachedDoc" class="form-label">Attached Document</label>
                                <div>
                                    <button type="button" class="download-btn" onclick="downloadReport('inspection_summary_q1.pdf')">
                                        Click here to download
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Comment -->
                        <div class="row mb-3">
                            <div class="col-12 mb-3">
                                <label for="comment" class="form-label">Comment</label>
                                <textarea class="form-control" id="comment" disabled></textarea>
                            </div>
                        </div>
                    </form>

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <div class="d-flex justify-content-center gap-3">
                            <button type="button" class="btn btn-approve">Approve</button>
                            <button type="button" class="btn btn-reject">Reject</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        function downloadReport(filename) {
            // Simulate download functionality
            console.log('Downloading:', filename);
            alert('Download functionality would be implemented here for: ' + filename);
        }

        // Close modal with X button
        document.querySelectorAll('.btn-close').forEach(button => {
            button.addEventListener('click', function() {
                const modal = bootstrap.Modal.getInstance(document.getElementById('requestLeaveModal'));
                if (modal) {
                    modal.hide();
                }
            });
        });

        // Handle rejection reason button selection
        document.querySelectorAll('.reject-reason-btn').forEach(button => {
            button.addEventListener('click', function() {
                // Remove active class from all buttons
                document.querySelectorAll('.reject-reason-btn').forEach(btn => {
                    btn.classList.remove('btn-primary', 'active');
                    btn.classList.add('btn-outline-secondary');
                });
                
                // Add active class to clicked button
                this.classList.remove('btn-outline-secondary');
                this.classList.add('btn-primary', 'active');
            });
        });

        // Handle reject button click to open rejection reason modal
        document.querySelector('.btn-reject').addEventListener('click', function() {
            const rejectionModal = new bootstrap.Modal(document.getElementById('rejectionReasonModal'));
            rejectionModal.show();
        });

        // Handle submit rejection
        document.getElementById('submitRejectBtn').addEventListener('click', function() {
            const selectedReasons = [];
            const activeButtons = document.querySelectorAll('.reject-reason-btn.active');
            activeButtons.forEach(btn => {
                selectedReasons.push(btn.getAttribute('data-reason'));
            });
            
            const otherConcerns = document.getElementById('rejectOtherReasonTextarea').value;
            
            console.log('Selected reasons:', selectedReasons);
            console.log('Other concerns:', otherConcerns);
            
            // Close the rejection modal
            const rejectionModal = bootstrap.Modal.getInstance(document.getElementById('rejectionReasonModal'));
            rejectionModal.hide();
            
            // Close the main modal
            const mainModal = bootstrap.Modal.getInstance(document.getElementById('requestLeaveModal'));
            mainModal.hide();
            
            alert('Rejection submitted with reasons: ' + selectedReasons.join(', ') + (otherConcerns ? '\nOther concerns: ' + otherConcerns : ''));
        });
    </script>
</body>
</html>
