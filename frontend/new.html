<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Management Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
    }

    header {
      background-color: #2c3e50;
      padding: 1rem;
      color: white;
      text-align: center;
    }

    nav {
      background-color: #34495e;
      padding: 1rem;
      display: flex;
      gap: 1.5rem;
      color: white;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .container {
      padding: 2rem;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .card {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }

    canvas {
      width: 100%;
      height: 300px;
    }

    .user-info {
      margin-top: 2rem;
    }

    .user-info h3 {
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Leave Management System</h1>
  </header>

  <nav>
    <a href="#">Dashboard</a>
    <a href="#">Apply Leave</a>
    <a href="#">Attendance</a>
    <a href="#">Settings</a>
  </nav>

  <div class="container">
    <div class="dashboard">
      <div class="card">
        <h2>Leaves Taken This Year</h2>
        <canvas id="leavesChart"></canvas>
      </div>

      <div class="card">
        <h2>Leave Summary</h2>
        <p>Total Leave Credits: <strong>30</strong></p>
        <p>Used: <strong>12</strong></p>
        <p>Remaining: <strong>18</strong></p>
      </div>
    </div>

    <div class="user-info card">
      <h3>Upcoming Leaves</h3>
      <ul>
        <li>Vacation Leave - June 10 to June 15</li>
        <li>Sick Leave - July 1</li>
      </ul>
    </div>
  </div>

  <script>
    const ctx = document.getElementById('leavesChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['January', 'February', 'March', 'April', 'May'],
        datasets: [{
          label: 'Leaves Taken',
          data: [2, 1, 4, 3, 2],
          backgroundColor: '#3498db'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            display: false
          },
          title: {
            display: true,
            text: 'Monthly Leave Usage'
          }
        }
      }
    });
  </script>
</body>
</html>
