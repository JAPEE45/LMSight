<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave Management - Admin Analytics</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
    }
    header {
      background-color: #1f2937;
      color: #fff;
      padding: 1rem 2rem;
      font-size: 1.5rem;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      padding: 2rem;
      gap: 2rem;
    }
    .left-panel, .right-panel {
      flex: 1;
      min-width: 300px;
      background: #fff;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card {
      background: #f9fafb;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    canvas {
      width: 100% !important;
      height: 300px !important;
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      margin: 0.5rem 0;
    }
    .badge {
      border-radius: 6px;
      padding: 0.2rem 0.6rem;
      color: white;
    }
    .approved { background-color: #16a34a; }
    .pending { background-color: #eab308; }
    .rejected { background-color: #dc2626; }
    .highlight {
      background-color: #e0f2fe;
      border-left: 5px solid #0284c7;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <header>
    🏢 Leave Management System - Admin Dashboard
  </header>

  <div class="container">
    <div class="left-panel">
      <h3>📊 Most Leaves Taken (All Time)</h3>
      <canvas id="leaveChart"></canvas>
    </div>

    <div class="right-panel">
      <div class="card">
        <h4>📋 Leave Summary</h4>
        <div class="summary-item"><span>🟢 Approved:</span> <span class="badge approved">44</span></div>
        <div class="summary-item"><span>🟡 Pending:</span> <span class="badge pending">6</span></div>
        <div class="summary-item"><span>🔴 Rejected:</span> <span class="badge rejected">2</span></div>
        <div class="summary-item"><strong>Total:</strong> <strong>52</strong></div>
      </div>

      <div class="card highlight">
        <h4>🏅 Most Leaves This Month</h4>
        <p><strong>👤 John Dela Cruz</strong></p>
        <p>🏢 IT Department</p>
        <p>📆 5 days (May 1–May 31)</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const ctx = document.getElementById('leaveChart').getContext('2d');
    const leaveChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['John D.', 'Maria L.', 'Kevin A.', 'Lisa W.', 'Dave M.'],
        datasets: [{
          label: 'Days of Leave',
          data: [15, 12, 10, 6, 5],
          backgroundColor: [
            '#0284c7', '#60a5fa', '#93c5fd', '#bfdbfe', '#dbeafe'
          ],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: context => `${context.dataset.label}: ${context.raw} days`
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              stepSize: 5
            }
          }
        }
      }
    });
  </script>
</body>
</html>
