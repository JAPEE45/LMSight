<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALIS</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="static/assets/styles/general.css" />
    <link
      rel="stylesheet"
      href="static/assets/styles/layouts/login_interface.css"
    />
  </head>
  <body>
    <main class="main active">
      <div class="front">
        <div class="image-wrapper">
          <img
            src="static/assets/images/millennial-asia-businessmen-businesswomen-meeting-brainstorming-ideas-about-new-paperwork-project-colleagues-working-together-planning-success-strategy-enjoy-teamwork-small-modern-night-office.jpg"
            alt="front"
          />
        </div>
        <header>
          <h1>ALIS</h1>
        </header>
        <div class="hero-cont">
          <p>Leave with ease</p>
        </div>
      </div>
      <form class="form" action="{% url 'login' %}" method="post">
        {% csrf_token %}
        <h1>Welcome back!</h1>
        <div class="inputs-container">
          <div class="inputs">
            <input id="username" placeholder=" " type="text" name="username" />
            <label>Username</label>
          </div>
          <div class="inputs">
            <input
              id="password"
              placeholder=" "
              type="password"
              name="password"
            />
            <label>Password</label>
          </div>
          <div class="showpasscont">
            <input type="checkbox" id="showpass" />
            <label class="showpss" for="showpass">Show password</label>
          </div>
          <button class="loginBtn">Log In</button>
          <!-- <a href="#">Forgot Password?</a> -->
        </div>
        <footer>
          <ul>
            <li><a href="">About</a></li>
            <li><a href="">Help</a></li>
            <li><a href="">Privacy</a></li>
            <li><a href="">Terms</a></li>
          </ul>
          <hr />
          <p>&copy; 2025 <span>Pogi Inc.</span> All rights reserver</p>
        </footer>
      </form>
    </main>
    <script>
      const passwordInput = document.getElementById("password");
      const showPassCheckbox = document.getElementById("showpass");

      showPassCheckbox.addEventListener("change", function () {
        if (this.checked) {
          passwordInput.type = "text";
        } else {
          passwordInput.type = "password";
        }
      });
    </script>
  </body>
</html>
