<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leave Ledger Export</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <button id="exportBtn">Export Leave Ledger to Excel</button>

  <script>
    document.getElementById("exportBtn").addEventListener("click", function () {

      // Example data from your image
      const leaveData = [
        ["PERIOD", "EARNED (VL)", "BALANCE (VL)", "EARNED (SL)", "BALANCE (SL)", "Remarks"],
        ["7/3", 1.167, 1.167, 1.167, 1.167, ""],
        ["8/1", 1.250, 2.417, 1.250, 2.417, ""],
        ["9/1", 1.250, 3.667, 1.250, 3.667, ""],
        ["3/28-30/2007", "", 8.167, "", 11.167, "Leave Taken"],
        ["5/1", "", 10.167, 1.250, 12.917, "SL Availed"],
        ["8/2007", "", 5.000, "", 10.000, "Monetization"],
        ["4/1/2008", 1.250, 9.417, 1.250, 15.417, ""],
        ["6/1/2009", 1.250, 5.053, 1.250, 15.167, "SPL Availed"],
        ["10/1/2009", 0.375, 6.643, 0.375, 8.009, "SPL Availed"],
        ["12/31/2009", 0.500, 8.009, 0.500, 12.417, "Year-End Balance"],
        ["1/28/2010", 1.250, 11.509, 1.250, 12.417, ""]
      ];

      // Create a worksheet
      const ws = XLSX.utils.aoa_to_sheet(leaveData);

      // Auto column width
      const colWidths = leaveData[0].map((_, i) => ({
        wch: Math.max(...leaveData.map(row => String(row[i] || "").length)) + 2
      }));
      ws["!cols"] = colWidths;

      // Create a workbook
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Leave Ledger");

      // Export
      XLSX.writeFile(wb, "LeaveLedger.xlsx");
    });
  </script>
</body>
</html>
